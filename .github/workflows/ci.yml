name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck setup.sh entrypoint.sh shell/cc-copilot.sh tests/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: pip install ruff==0.17.5 && ruff check .

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [bash, zsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        if: runner.os == 'Linux' && matrix.shell == 'zsh'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Installer test
        run: tests/installer_test.sh ${{ matrix.shell }}

  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model onboarding tests
        run: pip install pytest httpx && pytest -q tests

  compose:
    runs-on: ubuntu-latest
    env:
      COPILOT_TOKEN_DIR: /tmp/copilot-token
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway gateway key and SearXNG secret for this run
        run: |
          echo "LITELLM_MASTER_KEY=sk-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "SEARXNG_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Gateway image builds with pinned LiteLLM and its patches
        run: docker compose build gateway
      - name: Gateway image builds its CA bundle from the host certificates
        run: |
          mkdir -p /tmp/ca-state
          cp /etc/ssl/certs/ca-certificates.crt /tmp/ca-state/host-ca.pem
          docker run --rm --entrypoint python -v /tmp/ca-state:/state -e COPILOT_STATE_DIR=/state \
            tcc-copilot-gateway:local /app/ca_bundle.py
      - name: SearXNG answers JSON searches
        run: |
          image="$(docker compose config --images | grep searxng)"
          docker run -d --name searxng -p 127.0.0.1:8888:8080 -e SEARXNG_SECRET \
            -v "$PWD/searxng/settings.yml:/etc/searxng/settings.yml:ro" "$image"
          code=""
          for _ in $(seq 1 30); do
            code="$(curl -s -o /tmp/searx.json -w '%{http_code}' 'http://127.0.0.1:8888/search?q=litellm&format=json' || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          docker logs searxng | tail -20
          test "$code" = 200
          python3 -c 'import json; print(len(json.load(open("/tmp/searx.json"))["results"]), "results")'

  gate:
    name: Gate — Required
    needs: [lint, installer, onboarding, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All gates green
        run: |
          [ "${{ needs.lint.result }}" = success ] &&
          [ "${{ needs.installer.result }}" = success ] &&
          [ "${{ needs.onboarding.result }}" = success ] &&
          [ "${{ needs.compose.result }}" = success ]
